name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt -e .
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t churn-service .
      - name: Start container and hit /health and /predict
        run: |
          docker run -d --name churn -p 8000:8000 churn-service
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"tenure_months":3,"contract":"month_to_month","monthly_charges":89.9,"internet_service":"fiber","payment_method":"electronic_check","senior_citizen":false,"paperless_billing":true,"support_tickets_90d":2}'
          docker logs churn
